[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sonos-analyzer"
dynamic = ["version"]
description = "Analyze Sonos speakers on your local network, from the command line or a web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "David Klein" },
    { name = "Graham Fairbank" },
]
keywords = ["sonos", "network", "diagnostics", "wifi", "upnp", "docker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/grahamfairbank/sonos-analyzer"
Issues = "https://github.com/grahamfairbank/sonos-analyzer/issues"
"Original project" = "https://github.com/soinkleined/sonos-analyzer"

[project.scripts]
sonos-analyzer = "sonos_analyzer.cli:main"
sonos-analyzer-web = "sonos_analyzer.web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sonos_analyzer*"]

[tool.setuptools.dynamic]
version = { attr = "sonos_analyzer.__version__" }

[tool.setuptools.package-data]
sonos_analyzer = ["static/*"]
