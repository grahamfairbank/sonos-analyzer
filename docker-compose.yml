services:
  sonos-analyzer:
    build: .
    image: sonos-analyzer:latest
    container_name: sonos-analyzer
    # Host networking is required for SSDP discovery: multicast does not cross
    # Docker's bridge network. The UI is served on the host at SONOS_ANALYZER_PORT.
    network_mode: host
    environment:
      SONOS_ANALYZER_PORT: "8400"
      # Host names you open the page by, besides IP addresses, localhost, *.local and this
      # machine's own name (comma-separated). Set it in a .env file next to this one, e.g.
      # SONOS_ANALYZER_ALLOWED_HOSTS=nas.home.lan
      SONOS_ANALYZER_ALLOWED_HOSTS: ${SONOS_ANALYZER_ALLOWED_HOSTS:-}
      # Minutes between background scans that track restarts and changes; 0 turns them off.
      SONOS_ANALYZER_SCAN_INTERVAL: ${SONOS_ANALYZER_SCAN_INTERVAL:-15}
    volumes:
      - sonos-analyzer-data:/data
    restart: unless-stopped

volumes:
  sonos-analyzer-data:
