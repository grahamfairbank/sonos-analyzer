# Builds the desktop app for Windows and macOS (Apple silicon and Intel) and
# attaches it to the GitHub release. Builds are unsigned (pilot).
name: Build desktop app

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to
        required: true

# Build jobs run third-party build tools, so they only get read access;
# the attach job alone can write to the release.
permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-15
            label: macos-apple-silicon
          - os: macos-15-intel
            label: macos-intel
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install pyinstaller==6.22.3

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --console --name SonosAnalyzer \
            --paths . --add-data "sonos_analyzer/static:sonos_analyzer/static" packaging/launcher.py
          mkdir out
          cp dist/SonosAnalyzer.exe "out/SonosAnalyzer-${TAG#v}-${{ matrix.label }}.exe"
          echo "BIN=dist/SonosAnalyzer.exe" >> "$GITHUB_ENV"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "Sonos Analyzer" \
            --osx-bundle-identifier dev.grahamfairbank.sonos-analyzer \
            --paths . --add-data "sonos_analyzer/static:sonos_analyzer/static" packaging/launcher.py
          APP="dist/Sonos Analyzer.app"
          PLIST="$APP/Contents/Info.plist"
          # Ask for Local Network access (macOS 15+), and run without a Dock icon.
          plutil -insert NSLocalNetworkUsageDescription -string \
            "Sonos Analyzer reads diagnostics from the Sonos speakers on your network." "$PLIST"
          plutil -insert LSUIElement -bool true "$PLIST"
          # Apple expects a plain x.y.z here; the full pre-release version goes in CFBundleVersion.
          VERSION="${TAG#v}"
          plutil -replace CFBundleShortVersionString -string "${VERSION%%-*}" "$PLIST"
          plutil -replace CFBundleVersion -string "$VERSION" "$PLIST"
          codesign --force --deep --sign - "$APP"
          mkdir out
          ditto -c -k --keepParent "$APP" "out/SonosAnalyzer-${TAG#v}-${{ matrix.label }}.zip"
          echo "BIN=$APP/Contents/MacOS/Sonos Analyzer" >> "$GITHUB_ENV"

      - name: Smoke test
        run: |
          "$BIN" --no-browser --port 8400 --idle-timeout 0 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8400/api/app && break
            sleep 1
          done
          # Not piped into grep -q: grep exits early, curl then fails writing (exit 23).
          page=$(curl -sf http://127.0.0.1:8400/)
          grep -q "Sonos Analyzer" <<< "$page"
          curl -sf -X POST -H "Content-Type: application/json" -d "{}" http://127.0.0.1:8400/api/quit

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.label }}
          path: out/*

  attach:
    needs: build
    # Attach whatever built, so one stuck runner doesn't hold back the other platforms.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cd out
          rm -f SHA256SUMS.txt
          sha256sum SonosAnalyzer-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" out/* --clobber --repo "$REPO"
