# Builds the desktop app for Windows and macOS (one universal app for Apple silicon
# and Intel) and attaches it to the GitHub release. Builds are unsigned (pilot).
name: Build desktop app

on:
  release:
    types: [published]
  # Manual runs must be started from the release tag (gh workflow run desktop-build.yml --ref vX.Y.Z),
  # so the code built and the commit named in the build provenance are the same.
  workflow_dispatch:

# Build jobs run third-party build tools, so they only get read access;
# the attach job alone can write to the release.
permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          # One universal app for both Mac types, built on the Intel machines:
          # GitHub's Apple-silicon machines repeatedly never picked up the job.
          - os: macos-15-intel
            label: macos-universal
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require a release tag
        if: github.ref_type != 'tag' && github.event_name != 'release'
        run: |
          echo "Start this workflow from a release tag: gh workflow run desktop-build.yml --ref vX.Y.Z" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: runner.os == 'Windows'
        with:
          python-version: "3.14.10"

      # A universal app needs a universal Python: python.org's universal2 installer, pinned by hash.
      - name: Install universal2 Python (macOS)
        if: runner.os == 'macOS'
        env:
          PY_PKG: python-3.14.10-macos11.pkg
          PY_SHA256: 286c7018aa2730f6747ca433dccdc2b31be45f078a9ea0ffa44d5f06368fd2d7
        run: |
          curl -sSfL -o "$RUNNER_TEMP/$PY_PKG" "https://www.python.org/ftp/python/3.14.10/$PY_PKG"
          echo "$PY_SHA256  $RUNNER_TEMP/$PY_PKG" | shasum -a 256 -c -
          sudo installer -pkg "$RUNNER_TEMP/$PY_PKG" -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.14/bin/python3.14
          lipo -archs "$PY"
          "$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - run: python -m pip install --require-hashes -r packaging/requirements-build.txt

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --console --name SonosAnalyzer \
            --paths . --add-data "sonos_analyzer/static:sonos_analyzer/static" packaging/launcher.py
          mkdir out
          cp dist/SonosAnalyzer.exe "out/SonosAnalyzer-${TAG#v}-${{ matrix.label }}.exe"
          echo "BIN=dist/SonosAnalyzer.exe" >> "$GITHUB_ENV"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "Sonos Analyzer" --target-arch universal2 \
            --osx-bundle-identifier dev.grahamfairbank.sonos-analyzer \
            --paths . --add-data "sonos_analyzer/static:sonos_analyzer/static" packaging/launcher.py
          APP="dist/Sonos Analyzer.app"
          PLIST="$APP/Contents/Info.plist"
          # Ask for Local Network access (macOS 15+), and run without a Dock icon.
          plutil -insert NSLocalNetworkUsageDescription -string \
            "Sonos Analyzer reads diagnostics from the Sonos speakers on your network." "$PLIST"
          plutil -insert LSUIElement -bool true "$PLIST"
          # Apple expects a plain x.y.z here; the full pre-release version goes in CFBundleVersion.
          VERSION="${TAG#v}"
          plutil -replace CFBundleShortVersionString -string "${VERSION%%-*}" "$PLIST"
          plutil -replace CFBundleVersion -string "$VERSION" "$PLIST"
          codesign --force --deep --sign - "$APP"
          mkdir out
          ditto -c -k --keepParent "$APP" "out/SonosAnalyzer-${TAG#v}-${{ matrix.label }}.zip"
          # Fail unless the app really contains both Apple-silicon and Intel code.
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/Sonos Analyzer")
          echo "Architectures: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          echo "BIN=$APP/Contents/MacOS/Sonos Analyzer" >> "$GITHUB_ENV"

      - name: Smoke test
        run: |
          "$BIN" --no-browser --port 8400 --idle-timeout 0 > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8400/api/app && break
            sleep 1
          done
          # Not piped into grep -q: grep exits early, curl then fails writing (exit 23).
          page=$(curl -sf http://127.0.0.1:8400/)
          grep -q "Sonos Analyzer" <<< "$page"
          # The app's link carries this launch's key; requests without it must be refused.
          key=$(grep -o 'key=[A-Za-z0-9_-]*' app.log | head -1 | cut -d= -f2)
          test -n "$key"
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" -d "{}" http://127.0.0.1:8400/api/quit)
          test "$status" = 401
          curl -sf -X POST -H "Content-Type: application/json" -H "X-Analyzer-Key: $key" -d "{}" http://127.0.0.1:8400/api/quit

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.label }}
          path: out/*

  attach:
    needs: build
    # Attach whatever built, so one stuck runner doesn't hold back the other platforms.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build provenance for each download.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: |
          cd out
          rm -f SHA256SUMS.txt
          sha256sum SonosAnalyzer-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/SonosAnalyzer-*

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" out/* --clobber --repo "$REPO"
