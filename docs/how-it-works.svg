<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>How Sonos Analyzer works</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
<rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
<text x="40" y="52" font-size="28" font-weight="bold" fill="#222">How Sonos Analyzer works</text>
<text x="40" y="80" font-size="15" fill="#555">Reads the diagnostics built into the Sonos speakers on your network, compares them with earlier scans, and explains what to fix in plain words.</text>
<text x="40" y="122" font-size="13" font-weight="bold" fill="#3b7dd8">WAYS IN</text>
<rect x="40" y="135" width="240" height="100" rx="10" fill="#e8f1fb" stroke="#3b7dd8" stroke-width="2"/>
<text x="160.0" y="161" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Desktop app</text>
<text x="160.0" y="182" text-anchor="middle" font-size="13" fill="#333">Windows or Mac, nothing to install;</text>
<text x="160.0" y="200" text-anchor="middle" font-size="13" fill="#333">opens a browser tab with a key</text>
<text x="160.0" y="218" text-anchor="middle" font-size="13" fill="#333">made at each launch</text>
<path d="M280,185 L305,185" fill="none" stroke="#555" stroke-width="2"/>
<rect x="40" y="250" width="240" height="100" rx="10" fill="#e8f1fb" stroke="#3b7dd8" stroke-width="2"/>
<text x="160.0" y="276" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Docker on a server</text>
<text x="160.0" y="297" text-anchor="middle" font-size="13" fill="#333">always on, on the speakers' network;</text>
<text x="160.0" y="315" text-anchor="middle" font-size="13" fill="#333">scans on its own every 15 min</text>
<path d="M280,300 L305,300" fill="none" stroke="#555" stroke-width="2"/>
<rect x="40" y="365" width="240" height="100" rx="10" fill="#e8f1fb" stroke="#3b7dd8" stroke-width="2"/>
<text x="160.0" y="391" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Docker Desktop</text>
<text x="160.0" y="412" text-anchor="middle" font-size="13" fill="#333">a laptop with Docker; page on</text>
<text x="160.0" y="430" text-anchor="middle" font-size="13" fill="#333">this computer only; type one IP</text>
<path d="M280,415 L305,415" fill="none" stroke="#555" stroke-width="2"/>
<rect x="40" y="480" width="240" height="100" rx="10" fill="#e8f1fb" stroke="#3b7dd8" stroke-width="2"/>
<text x="160.0" y="506" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Command line</text>
<text x="160.0" y="527" text-anchor="middle" font-size="13" fill="#333">sonos-analyzer --ips ...</text>
<text x="160.0" y="545" text-anchor="middle" font-size="13" fill="#333">prints, or saves JSON / HTML</text>
<path d="M280,530 L305,530" fill="none" stroke="#555" stroke-width="2"/>
<path d="M305,185 L305,530" fill="none" stroke="#555" stroke-width="2"/>
<path d="M305,230 L330,230" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
<rect x="330" y="160" width="190" height="140" rx="10" fill="#e9f6ee" stroke="#2e8b57" stroke-width="2"/>
<text x="425.0" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">1. Find speakers</text>
<text x="425.0" y="207" text-anchor="middle" font-size="13" fill="#333">SSDP search on every</text>
<text x="425.0" y="225" text-anchor="middle" font-size="13" fill="#333">network interface, a typed</text>
<text x="425.0" y="243" text-anchor="middle" font-size="13" fill="#333">IP, or the last known</text>
<text x="425.0" y="261" text-anchor="middle" font-size="13" fill="#333">speakers</text>
<rect x="540" y="160" width="190" height="140" rx="10" fill="#e9f6ee" stroke="#2e8b57" stroke-width="2"/>
<text x="635.0" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">2. Read diagnostics</text>
<text x="635.0" y="207" text-anchor="middle" font-size="13" fill="#333">up to 12 speakers at once:</text>
<text x="635.0" y="225" text-anchor="middle" font-size="13" fill="#333">support review, groups,</text>
<text x="635.0" y="243" text-anchor="middle" font-size="13" fill="#333">model, radio status;</text>
<text x="635.0" y="261" text-anchor="middle" font-size="13" fill="#333">PHY errors over 5 s</text>
<rect x="750" y="160" width="190" height="140" rx="10" fill="#e9f6ee" stroke="#2e8b57" stroke-width="2"/>
<text x="845.0" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">3. Compare</text>
<text x="845.0" y="207" text-anchor="middle" font-size="13" fill="#333">with earlier scans: missing</text>
<text x="845.0" y="225" text-anchor="middle" font-size="13" fill="#333">speakers, restarts, IP,</text>
<text x="845.0" y="243" text-anchor="middle" font-size="13" fill="#333">firmware, coordinator and</text>
<text x="845.0" y="261" text-anchor="middle" font-size="13" fill="#333">spanning-tree changes</text>
<rect x="960" y="160" width="190" height="140" rx="10" fill="#e9f6ee" stroke="#2e8b57" stroke-width="2"/>
<text x="1055.0" y="186" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">4. Analyze</text>
<text x="1055.0" y="207" text-anchor="middle" font-size="13" fill="#333">firmware lines, rooms and</text>
<text x="1055.0" y="225" text-anchor="middle" font-size="13" fill="#333">groups, Wi-Fi, noise and</text>
<text x="1055.0" y="243" text-anchor="middle" font-size="13" fill="#333">signal, wired errors,</text>
<text x="1055.0" y="261" text-anchor="middle" font-size="13" fill="#333">SonosNet bridge</text>
<path d="M520,230 L540,230" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
<path d="M730,230 L750,230" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
<path d="M940,230 L960,230" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
<rect x="330" y="390" width="400" height="110" rx="10" fill="#f3eefb" stroke="#7a4fc4" stroke-width="2"/>
<text x="530.0" y="416" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Sonos speakers on your network</text>
<text x="530.0" y="437" text-anchor="middle" font-size="13" fill="#333">port 1400: /support/review, zone topology,</text>
<text x="530.0" y="455" text-anchor="middle" font-size="13" fill="#333">device description, radio status</text>
<text x="530.0" y="473" text-anchor="middle" font-size="13" fill="#333">read-only, no Sonos account or cloud</text>
<path d="M425,300 L425,390" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="452" y="350" text-anchor="middle" font-size="12" fill="#555">search</text>
<path d="M635,300 L635,390" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<text x="680" y="350" text-anchor="middle" font-size="12" fill="#555">HTTP / SOAP</text>
<rect x="750" y="390" width="190" height="110" rx="10" fill="#fdf3e3" stroke="#c98a12" stroke-width="2"/>
<text x="845.0" y="416" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Scan history</text>
<text x="845.0" y="437" text-anchor="middle" font-size="13" fill="#333">one small file per scan,</text>
<text x="845.0" y="455" text-anchor="middle" font-size="13" fill="#333">kept 30 days; Docker</text>
<text x="845.0" y="473" text-anchor="middle" font-size="13" fill="#333">volume or app-data folder</text>
<path d="M845,300 L845,390" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)" marker-start="url(#ah)"/>
<rect x="960" y="390" width="190" height="190" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
<text x="1055.0" y="416" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">5. Results page</text>
<text x="1055.0" y="437" text-anchor="middle" font-size="13" fill="#333">findings to act on, plus</text>
<text x="1055.0" y="455" text-anchor="middle" font-size="13" fill="#333">a collapsed informational</text>
<text x="1055.0" y="473" text-anchor="middle" font-size="13" fill="#333">section; plain-language</text>
<text x="1055.0" y="491" text-anchor="middle" font-size="13" fill="#333">readings with bars and</text>
<text x="1055.0" y="509" text-anchor="middle" font-size="13" fill="#333">colors; speaker signal</text>
<text x="1055.0" y="527" text-anchor="middle" font-size="13" fill="#333">map; JSON and HTML</text>
<text x="1055.0" y="545" text-anchor="middle" font-size="13" fill="#333">downloads</text>
<path d="M1055,300 L1055,390" fill="none" stroke="#555" stroke-width="2" marker-end="url(#ah)"/>
<text x="1085" y="350" text-anchor="middle" font-size="12" fill="#555">report</text>
<text x="1055" y="598" text-anchor="middle" font-size="12" fill="#555">in the browser, or from the command line</text>
<rect x="330" y="615" width="830" height="115" rx="10" fill="#f4f4f2" stroke="#8a877f" stroke-width="2"/>
<text x="745.0" y="641" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Safeguards</text>
<text x="745.0" y="662" text-anchor="middle" font-size="13" fill="#333">Contacts only private IPv4 addresses on port 1400, never follows redirects, and caps response sizes.</text>
<text x="745.0" y="680" text-anchor="middle" font-size="13" fill="#333">The page refuses unknown host names (DNS rebinding) and cross-site requests; there is no login, so keep servers on a trusted network.</text>
<text x="745.0" y="698" text-anchor="middle" font-size="13" fill="#333">The desktop app requires the key from the link it opened. Nothing on the speakers is changed (reading the PHY counter clears it).</text>
<text x="40" y="620" font-size="13" font-weight="bold" fill="#555">KEY</text>
<rect x="40" y="634" width="14" height="14" rx="3" fill="#e8f1fb" stroke="#3b7dd8" stroke-width="2"/>
<text x="62" y="646" font-size="13" fill="#333">Ways in</text>
<rect x="40" y="654" width="14" height="14" rx="3" fill="#e9f6ee" stroke="#2e8b57" stroke-width="2"/>
<text x="62" y="666" font-size="13" fill="#333">Sonos Analyzer</text>
<rect x="40" y="674" width="14" height="14" rx="3" fill="#f3eefb" stroke="#7a4fc4" stroke-width="2"/>
<text x="62" y="686" font-size="13" fill="#333">Outside it</text>
<rect x="40" y="694" width="14" height="14" rx="3" fill="#fdf3e3" stroke="#c98a12" stroke-width="2"/>
<text x="62" y="706" font-size="13" fill="#333">Data it keeps</text>
<rect x="40" y="714" width="14" height="14" rx="3" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
<text x="62" y="726" font-size="13" fill="#333">What you see</text>
<text x="40" y="780" font-size="12" fill="#888">sonos-analyzer · docs/how-it-works.svg · 2026-11-13 · github.com/grahamfairbank/sonos-analyzer</text>
</svg>